# ========================================
# CORS CONFIGURATION
# ========================================
# This file should be included INSIDE the http block in nginx.conf

# Map to determine allowed origin
map $http_origin $allow_origin {
    default "";
    # Local development
    "~^http://localhost:3001$" $http_origin;
    "~^http://localhost:5173$" $http_origin;
    "~^http://localhost:4200$" $http_origin;
    "~^http://127.0.0.1:3000$" $http_origin;
    "~^http://127.0.0.1:5173$" $http_origin;
    # Production domains (add your production URLs here)
    "~^https://.*\.yourdomain\.com$" $http_origin;
}

# Map to set CORS headers
map $request_method $cors_method {
    OPTIONS 11;
    default 1;
}

