# Job Service - Protected routes
location /api/bids {
  # CORS headers
  include /etc/nginx/conf.d/cors-headers.conf;
  
  # Handle preflight OPTIONS requests
  if ($request_method = 'OPTIONS') {
    return 204;
  }
  
  # Step 1: Validate authentication
  auth_request /internal/auth/validate;
  
  # Step 2: Extract user info from auth response headers
  auth_request_set $user_id $upstream_http_x_user_id;
  auth_request_set $user_email $upstream_http_x_user_email;
  auth_request_set $user_role $upstream_http_x_user_role;
  
  # Step 3: Forward to user service with user context
  proxy_pass http://job_bid_service/bids;

  # Add user context to headers
  proxy_set_header X-User-Id $user_id;
  proxy_set_header X-User-Email $user_email;
  proxy_set_header X-User-Role $user_role;
  
  # Standard proxy headers
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  
  # Keepalive
  proxy_http_version 1.1;
  proxy_set_header Connection "";
}