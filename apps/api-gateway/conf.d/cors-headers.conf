# ========================================
# CORS HEADERS SNIPPET  
# ========================================
# Include this file inside each location block that needs CORS

# Add CORS headers to all responses (including OPTIONS)
add_header 'Access-Control-Allow-Origin' '$allow_origin' always;
add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-Id,X-User-Email,X-User-Role' always;
add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,X-User-Id,X-User-Email,X-User-Role' always;
add_header 'Access-Control-Allow-Credentials' 'true' always;
add_header 'Access-Control-Max-Age' '1728000' always;
