# ========================================
# INTERNAL AUTH VALIDATION ENDPOINT
# ========================================
location = /internal/auth/validate {
  internal;  # Only accessible from nginx internally
  
  proxy_pass http://auth_service/auth/validate;
  
  # Don't forward request body
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  
  # Forward original request info
  proxy_set_header X-Original-URI $request_uri;
  proxy_set_header X-Original-Method $request_method;
  proxy_set_header Authorization $http_authorization;
  
  # Timeout settings
  proxy_connect_timeout 5s;
  proxy_send_timeout 5s;
  proxy_read_timeout 5s;
}
