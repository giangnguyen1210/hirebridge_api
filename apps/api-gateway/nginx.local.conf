events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # CORS Configuration - Must be in http block
    include /etc/nginx/cors-map.conf;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstream definitions for LOCAL DEVELOPMENT
    # Points to host.docker.internal to access services running on the Mac host
    
    upstream auth_service {
      server host.docker.internal:6060;
      keepalive 32;
    }

    upstream users_service {
      server host.docker.internal:6060;
      keepalive 32;
    }

    upstream job_service {
      server host.docker.internal:6061;
      keepalive 32;
    }

    upstream job_bid_service {
      server host.docker.internal:6061;
      keepalive 32;
    }

    # upstream project_service {
    #   server host.docker.internal:6062;
    #   keepalive 32;
    # }
    
    server {
      listen 80;
      server_name localhost;

      # Health check
      location / {
          return 200 'API Gateway matches LOCAL services!';
      }

      # Include all location blocks from conf.d
      include /etc/nginx/conf.d/*.conf; 
    }
}
